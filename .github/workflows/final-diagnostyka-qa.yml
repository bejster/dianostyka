name: Final Diagnostyka QA

on:
  push:
    branches:
      - work/final-diagnostyka-emotion-voice-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Lint changed surface
        run: npx eslint app/components/DecisionDiagnostic.tsx app/lib/decision-diagnostic.ts app/lib/decision-insights.ts app/lib/decision-presentation.ts app/lib/result-refinement.ts tests/decision-diagnostic.test.ts tests/decision-insights.test.ts tests/decision-presentation.test.ts tests/result-refinement.test.ts tests/result-v4-payoff.test.ts tests/v28-awareness-first.test.ts tests/voice-trust-v264.test.ts
      - name: Build
        run: npm run build
