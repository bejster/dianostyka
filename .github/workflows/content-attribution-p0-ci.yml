name: P0 Attribution CI

on:
  pull_request:
    branches:
      - release/diag-leverage-copy-20260924
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx eslint app/diagnoza/page.tsx app/lib/acquisition.ts tests/acquisition.test.ts
      - run: npm run build
